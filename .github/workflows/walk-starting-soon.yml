name: Walk starting soon

on:
  schedule:
    # GitHub often skips a job that is supposed to start every 15 minutes.
    # This one stays awake and looks itself, and a new one is booked often
    # enough that a look is always running.
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: walk-starting-soon
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Look for walks that are about to start
        run: |
          # 22 looks, 15 minutes apart: just over five hours. The next
          # booked run is waiting, so there is no gap when this one ends.
          for i in $(seq 1 22); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              https://burysteps-walkinggroup.co.uk/api/cron/walk-starting-soon \
              || echo "This look failed. The next one will try again."
            if [ "$i" -lt 22 ]; then
              sleep 900
            fi
          done
